name: tests

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install PyYAML pytest psutil
          python -m pip install -r requirements-corpus.txt
      - name: Run tests without GPU
        env:
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: python -m pytest -q
      - name: Verify Windows PowerShell script rejects unavailable GPU
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $pythonPath = (Get-Command python).Source
          $rejected = $false
          $reportPath = 'reports/curriculum-v2/gtx1650-512-auto-calibration.json'
          if (Test-Path -LiteralPath $reportPath) { Remove-Item -LiteralPath $reportPath -Force }
          try {
            & .\scripts\calibrate-gtx1650.ps1 -Python $pythonPath -Steps 2 -Context 512
          } catch {
            $rejected = $true
            Write-Host $_.Exception.Message
          }
          if (-not $rejected) { throw 'CPU-only runner must reject GPU calibration.' }
          $report = Get-Content -Raw $reportPath | ConvertFrom-Json
          if ($report.cuda_available -ne $false -or $report.calibration.completed -ne $false) {
            throw 'Expected a structured report with CUDA unavailable and calibration incomplete.'
          }
          $global:LASTEXITCODE = 0
      - name: Preserve Windows CPU calibration diagnostic
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-cpu-calibration-diagnostic
          path: reports/curriculum-v2/gtx1650-512-auto-calibration.json
