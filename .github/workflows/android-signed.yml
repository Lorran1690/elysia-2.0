name: Verify signed Elysia Android release
on:
  workflow_dispatch:
  push:
    branches: [feature/media-creation]
    paths:
      - 'artifacts/android/**'
permissions:
  contents: read
jobs:
  installed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Verify the signed production package
        run: |
          test -f artifacts/android/Elysia-Android.apk
          sdkmanager 'build-tools;36.0.0'
          python desktop/scripts/verify-android-release.py --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2" --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 artifacts/android/Elysia-Android.apk
          python -m pip install playwright==1.60.0
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-elysia-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and open the actual signed release
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          avd-name: elysia-release
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot
          script: python desktop/scripts/test-android-device.py --apk artifacts/android/Elysia-Android.apk --app-id org.elysia.mobile --release-smoke --output reports/android-release
      - name: Verify physical portrait and landscape captures
        run: |
          python - <<'PY'
          import json
          import struct
          from pathlib import Path

          output = Path('reports/android-release')
          dimensions = {}
          for name, orientation in [('release-portrait.png', 'portrait'), ('release-landscape.png', 'landscape')]:
              header = (output / name).read_bytes()[:24]
              assert len(header) == 24 and header[:8] == b'\x89PNG\r\n\x1a\n' and header[12:16] == b'IHDR', 'Invalid Android screenshot: ' + name
              width, height = struct.unpack('>II', header[16:24])
              assert width > 0 and height > 0, (name, width, height)
              assert (height > width) if orientation == 'portrait' else (width > height), ('Android rotation was not captured', name, width, height)
              dimensions[orientation] = {'width': width, 'height': height}
          report_path = output / 'device-verification.json'
          report = json.loads(report_path.read_text())
          assert report['passed'] and report['release_signed_apk_smoke'] and report['portrait_landscape_captured'], report
          report['physical_screenshot_dimensions'] = dimensions
          report_path.write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps({'physical_screenshot_dimensions': dimensions}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Elysia-Android-signed-release-verification-attempt-${{ github.run_attempt }}
          path: reports/android-release/
          retention-days: 90
