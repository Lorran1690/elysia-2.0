name: Native Elysia Windows desktop
on:
  workflow_dispatch:
  push:
    branches: [feature/media-creation]
    paths:
      - 'desktop/**'
      - 'interface/**'
      - 'actions/**'
      - 'memory/**'
      - 'brain/**'
      - 'scripts/test-installer-windows.py'
      - '.github/workflows/native-desktop.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Verify native frontend
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: native-rust-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - name: Verify Rust and build Tauri 2
        working-directory: desktop
        run: |
          rustup default stable
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml
          npm run tauri -- build --no-bundle
      - uses: actions/cache/save@v4
        if: steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: native-rust-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - name: Prepare Python core
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-desktop-build.txt
          python -m pip install playwright==1.56.0
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name Elysia --paths . --add-data "interface/web;interface/web" --add-data "artifacts/aira-dialogue-v1/run-001/sft-model.pt;artifacts/aira-dialogue-v1/run-001" --add-data "data/corpus-pt-v1/tokenizer/elysia-bpe.json;data/corpus-pt-v1/tokenizer" scripts/desktop-entry.py
          python scripts/desktop-licenses.py dist/Elysia/licenses
      - name: Assemble native app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Elysia-native/core | Out-Null
          Copy-Item dist/Elysia/* dist/Elysia-native/core -Recurse
          Copy-Item desktop/src-tauri/target/release/elysia-desktop.exe dist/Elysia-native/Elysia.exe
          Copy-Item desktop/README.md dist/Elysia-native/LEIA-ME.md
          Copy-Item desktop/THIRD-PARTY-NOTICES.md dist/Elysia-native/THIRD-PARTY-NOTICES.md
          python desktop/scripts/package-licenses.py dist/Elysia-native/THIRD-PARTY-LICENSES
          Copy-Item interface/MODULES.md dist/Elysia-native/MODULES.md
          Copy-Item interface/GENERATIVE-MEDIA.md dist/Elysia-native/GENERATIVE-MEDIA.md
      - name: Prepare verified Microsoft WebView2 prerequisite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceUri = 'https://go.microsoft.com/fwlink/p/?LinkId=2124703'
          $bootstrapper = Join-Path $env:GITHUB_WORKSPACE 'dist\prerequisites\MicrosoftEdgeWebview2Setup.exe'
          New-Item -ItemType Directory -Force (Split-Path $bootstrapper) | Out-Null
          Invoke-WebRequest -Uri $sourceUri -OutFile $bootstrapper -TimeoutSec 120 -MaximumRetryCount 2 -RetryIntervalSec 2
          $signature = Get-AuthenticodeSignature -LiteralPath $bootstrapper
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate) {
            throw 'The WebView2 bootstrapper must have a valid Authenticode signature.'
          }
          $subject = $signature.SignerCertificate.Subject
          if ($subject -notmatch '(?:^|,\s*)CN=Microsoft Corporation(?:,|$)' -or $subject -notmatch '(?:^|,\s*)O=Microsoft Corporation(?:,|$)') {
            throw 'The WebView2 bootstrapper signer must be Microsoft Corporation.'
          }
          $digest = (Get-FileHash -LiteralPath $bootstrapper -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -notmatch '^[a-f0-9]{64}$') { throw 'Invalid prerequisite SHA-256.' }
          $metadata = [ordered]@{
            source_url = $sourceUri
            file = 'MicrosoftEdgeWebview2Setup.exe'
            bytes = (Get-Item -LiteralPath $bootstrapper).Length
            sha256 = $digest
            signature_status = $signature.Status.ToString()
            signer_subject = $subject
            signer_thumbprint = $signature.SignerCertificate.Thumbprint
            product_version = (Get-Item -LiteralPath $bootstrapper).VersionInfo.ProductVersion
            runtime_registry_guid = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
            installer_arguments = '/silent /install'
            installed_only_when_absent = $true
            default_scope = 'per-user without elevation; Microsoft Edge Updater may promote to per-machine'
          }
          $metadata | ConvertTo-Json | Set-Content -Path webview2-prerequisite.json -Encoding utf8
          Copy-Item webview2-prerequisite.json dist/Elysia-native/webview2-prerequisite.json
      - name: Build native installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $prerequisite = Get-Content -Raw webview2-prerequisite.json | ConvertFrom-Json
          & $compiler "/DAppSourceDir=$env:GITHUB_WORKSPACE\dist\Elysia-native" "/DAppOutputDir=$env:GITHUB_WORKSPACE" "/DAppVersion=2.1.$env:GITHUB_RUN_NUMBER" "/DAppIconFile=$env:GITHUB_WORKSPACE\desktop\src-tauri\icons\icon.ico" "/DAppWebView2Bootstrapper=$env:GITHUB_WORKSPACE\dist\prerequisites\MicrosoftEdgeWebview2Setup.exe" "/DAppWebView2Sha256=$($prerequisite.sha256)" interface/installer/elysia.iss
          if ($LASTEXITCODE -ne 0) { throw 'Native installer compilation failed.' }
      - name: Verify real installed native WebView2 app and private data
        run: python scripts/test-installer-windows.py Elysia-Setup-x64.exe --native
      - name: Package and hash verified files
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Elysia-native -DestinationPath Elysia-Native-Windows-x64.zip
          (Get-FileHash Elysia-Setup-x64.exe -Algorithm SHA256).Hash | Out-File Elysia-Setup-x64.sha256 -Encoding ascii
          (Get-FileHash Elysia-Native-Windows-x64.zip -Algorithm SHA256).Hash | Out-File Elysia-Native-Windows-x64.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Elysia-native-Windows
          path: |
            Elysia-Setup-x64.exe
            Elysia-Setup-x64.sha256
            Elysia-Native-Windows-x64.zip
            Elysia-Native-Windows-x64.sha256
            installer-verification.json
            webview2-prerequisite.json
            native-ui-verification/
          retention-days: 90
      - name: Publish verified native app
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "native-$($env:GITHUB_SHA.Substring(0,12))"
          gh release create $tag Elysia-Setup-x64.exe Elysia-Setup-x64.sha256 Elysia-Native-Windows-x64.zip Elysia-Native-Windows-x64.sha256 installer-verification.json webview2-prerequisite.json native-ui-verification/ui-verification.json native-ui-verification/conversation.png native-ui-verification/settings-audio.png --target $env:GITHUB_SHA --prerelease --title "Elysia Desktop nativa · $tag" --notes-file desktop/RELEASE-NOTES.md
